backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: assets/uploads/blogs
public_folder: /assets/uploads/blogs

site_url: https://reevanax.com
display_url: https://reevanax.com
logo_url: /assets/uploads/2025/04/cropped-favicon-192x192.png

collections:
  - name: blogs
    label: Blog Posts
    label_singular: Blog Post
    folder: content/blogs
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ['date', 'title', 'commit_date']
    fields:
      - { label: "Article Title", name: "title", widget: "string" }
      - { label: "URL Slug", name: "slug", widget: "string", hint: "URL path under /blogs/ (e.g., best-skincare-treatment-in-surat)" }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Author", name: "author", widget: "string", default: "Dr. ReevanaX Medical Team" }
      - { label: "Category", name: "category", widget: "select", options: ["Skincare Treatment", "Haircare Treatment", "Plastic Surgery", "Cosmetic Gynecology", "Anti-Aging", "Male Aesthetics", "Wellness"], default: "Skincare Treatment" }
      - { label: "Tags", name: "tags", widget: "list", default: ["Skincare", "ReevanaX Surat", "Clinic Treatment"] }
      - { label: "Featured Banner Image", name: "featured_image", widget: "image", required: false, hint: "Recommended size: 780x520px or 1200x630px" }
      - { label: "Image Alt Text (SEO)", name: "featured_image_alt", widget: "string", default: "ReevanaX Clinic Treatment in Surat", required: false }
      - { label: "Short Excerpt", name: "excerpt", widget: "text", hint: "Short 2-sentence summary displayed on blog overview cards" }
      
      - label: "SEO & Social Sharing (Search Engine Optimization)"
        name: "seo"
        widget: "object"
        collapsed: false
        fields:
          - { label: "Meta Title Tag", name: "meta_title", widget: "string", required: false, hint: "Title displayed on Google SERP (50–60 characters)" }
          - { label: "Meta Description", name: "meta_description", widget: "text", required: false, hint: "Compelling summary shown in search snippets (140–160 characters)" }
          - { label: "Focus Keyword", name: "focus_keyword", widget: "string", required: false, hint: "Primary keyword phrase targeted by this article" }
          - { label: "Canonical URL", name: "canonical_url", widget: "string", required: false, hint: "Leave blank to auto-generate canonical link to this page" }
      
      - { label: "Article Content", name: "body", widget: "markdown" }
